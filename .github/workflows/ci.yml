name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --package-lock=false

      - name: Check Baguette and Bake
        run: npm run check

      - name: Test canonical Thistle source contract
        run: npm run test:source-contract

      - name: Verify Teto compatibility
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/kittycrow-kittyx/teto.git ../teto-check
          if [ -f ../teto-check/scripts/regenerate.sh ]; then
            # Test this compiler revision, not just the previously committed WAT.
            git -C ../teto-check/baguette fetch --depth 1 "$GITHUB_WORKSPACE" "$GITHUB_SHA"
            git -C ../teto-check/baguette checkout --detach FETCH_HEAD
            git -C ../teto-check add baguette
            git -C ../teto-check submodule update --init --recursive
            cd ../teto-check
            npm install --package-lock=false
            bash scripts/regenerate.sh
          else
            # Compatibility with Teto revisions preceding the source-only layout.
            rm -rf ../teto-check/baguette
            mkdir -p ../teto-check/baguette
            rsync -a --exclude .git --exclude node_modules ./ ../teto-check/baguette/
            cd ../teto-check
            npm install
            npm run teto:build
          fi

      - name: Verify Sandsara compatibility
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/kitty-crow/sandsara-track-viewer.git ../sandsara-check
          rm -rf ../sandsara-check/baguette
          mkdir -p ../sandsara-check/baguette
          rsync -a --exclude .git --exclude node_modules ./ ../sandsara-check/baguette/
          cd ../sandsara-check
          npm install
          npm run build:router-wasm
