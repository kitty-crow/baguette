name: Recheck patch snapshot

on:
  pull_request:
    branches: [agent/obfuscation-lowering]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.pull_request.head.ref == 'agent/tarot-engine-wide'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tarot-engine-wide
          fetch-depth: 0
          submodules: false

      - name: Pack staged compiler patch
        run: |
          tar -czf baguette-wide-patch.tar.gz .apply-wide.00 .apply-wide.01 .apply-wide.02 .apply-wide.03 .apply-wide2.00 .apply-wide2.01 .apply-wide2.02 .apply-wide2.03
          sha256sum baguette-wide-patch.tar.gz > baguette-wide-patch.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: baguette-wide-patch
          path: |
            baguette-wide-patch.tar.gz
            baguette-wide-patch.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
