name: Canonical Bake integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  integrate:
    if: github.head_ref == 'agent/canonical-bake'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-bake
          fetch-depth: 0
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Integrate Bake
        shell: bash
        run: |
          set -Eeuo pipefail

          git submodule add https://github.com/kitty-crow/bake.git vendor/bake
          git -C vendor/bake checkout bb7bee5c1926de056bec72288d5e2ee28e8e383b

          cat > src/bake-stage.ts <<'TS'
          import ts from "typescript";

          interface HostProcess {
            argv: string[];
            cwd(): string;
            env: Record<string, string | undefined>;
            execPath: string;
          }
          interface HostFs {
            access(path: string): Promise<void>;
            mkdir(path: string, options: { recursive: boolean }): Promise<void>;
            readFile(path: string, encoding: "utf8"): Promise<string>;
            rm(path: string, options: { recursive: boolean; force: boolean }): Promise<void>;
            writeFile(path: string, data: string): Promise<void>;
          }
          interface HostPath {
            dirname(path: string): string;
            isAbsolute(path: string): boolean;
            join(...parts: string[]): string;
            normalize(path: string): string;
            relative(from: string, to: string): string;
            resolve(...parts: string[]): string;
            sep: string;
          }
          interface HostUrl { fileURLToPath(url: string): string; }
          interface HostChild {
            once(event: "exit", listener: (code: number | null) => void): void;
            once(event: "error", listener: (error: Error) => void): void;
          }
          interface HostChildProcess {
            spawn(executable: string, args: string[], options: {
              cwd: string;
              env: Record<string, string | undefined>;
              stdio: "inherit";
            }): HostChild;
          }
          interface BaguetteVariant { name: string; threaded?: boolean; preludeFile?: string; }
          interface BaguetteConfig {
            project?: string;
            entries: string[];
            generatedDir?: string;
            outDir?: string;
            preludeFile?: string;
            intrinsicModules?: string[];
            variants?: BaguetteVariant[];
            [key: string]: unknown;
          }

          const processHost = (globalThis as unknown as { process: HostProcess }).process;
          const fs = await import("node:fs/promises" as string) as unknown as HostFs;
          const pathHost = await import("node:path" as string) as unknown as HostPath;
          const urlHost = await import("node:url" as string) as unknown as HostUrl;
          const childProcess = await import("node:child_process" as string) as unknown as HostChildProcess;
          const root = processHost.cwd();

          function optionValue(name: string): string | undefined {
            const direct = processHost.argv.find(value => value.startsWith(`${name}=`));
            if (direct) return direct.slice(name.length + 1);
            const index = processHost.argv.indexOf(name);
            return index >= 0 ? processHost.argv[index + 1] : undefined;
          }

          function setConfigArg(value: string): void {
            const directIndex = processHost.argv.findIndex(item => item.startsWith("--config="));
            if (directIndex >= 0) {
              processHost.argv[directIndex] = `--config=${value}`;
              return;
            }
            const index = processHost.argv.indexOf("--config");
            if (index >= 0) {
              processHost.argv[index + 1] = value;
              return;
            }
            processHost.argv.push("--config", value);
          }

          async function exists(path: string): Promise<boolean> {
            try {
              await fs.access(path);
              return true;
            } catch {
              return false;
            }
          }

          async function readJson<T>(path: string): Promise<T> {
            return JSON.parse(await fs.readFile(path, "utf8")) as T;
          }

          async function writeJson(path: string, value: unknown): Promise<void> {
            await fs.mkdir(pathHost.dirname(path), { recursive: true });
            await fs.writeFile(path, `${JSON.stringify(value, null, 2)}\n`);
          }

          async function run(command: string[], cwd: string, label: string): Promise<void> {
            const executable = command[0];
            if (!executable) throw new Error(`${label} has no executable`);
            await new Promise<void>((resolve, reject) => {
              const child = childProcess.spawn(executable, command.slice(1), {
                cwd,
                env: processHost.env,
                stdio: "inherit",
              });
              child.once("exit", code => code === 0 ? resolve() : reject(new Error(`${label} exited with status ${code ?? -1}`)));
              child.once("error", error => reject(new Error(`${label} could not start: ${error.message}`)));
            });
          }

          function normalise(value: string): string {
            return pathHost.normalize(pathHost.resolve(value));
          }

          function commonDirectory(files: readonly string[]): string {
            const firstFile = files[0];
            if (!firstFile) return root;
            const parts = files.map(file => normalise(file).split(pathHost.sep));
            const first = parts[0];
            if (!first) return pathHost.dirname(firstFile);
            const shared: string[] = [];
            for (let index = 0; ; index++) {
              const value = first[index];
              if (value === undefined || !parts.every(item => item[index] === value)) break;
              shared.push(value);
            }
            return shared.join(pathHost.sep) || pathHost.dirname(firstFile);
          }

          function relativeJson(from: string, to: string): string {
            const value = pathHost.relative(from, to).split(pathHost.sep).join("/");
            return value.startsWith(".") ? value : `./${value}`;
          }

          function parseProject(project: string): ts.Program {
            const config = ts.readConfigFile(project, ts.sys.readFile);
            if (config.error) throw new Error(ts.flattenDiagnosticMessageText(config.error.messageText, "\n"));
            const parsed = ts.parseJsonConfigFileContent(config.config, ts.sys, pathHost.dirname(project), {
              noEmit: true,
              incremental: false,
              composite: false,
            }, project);
            if (parsed.errors.length) {
              throw new Error(parsed.errors.map(item => ts.flattenDiagnosticMessageText(item.messageText, "\n")).join("\n"));
            }
            return ts.createProgram({ rootNames: parsed.fileNames, options: parsed.options });
          }

          const originalConfigPath = pathHost.resolve(root, optionValue("--config") ?? "baguette.config.json");
          const configRoot = pathHost.dirname(originalConfigPath);
          const config = await readJson<BaguetteConfig>(originalConfigPath);
          if (!Array.isArray(config.entries) || config.entries.length === 0) {
            throw new Error(`${originalConfigPath} must define at least one TypeScript entry module`);
          }

          const stageRoot = pathHost.resolve(configRoot, "build/baguette-bake");
          const inputDir = pathHost.join(stageRoot, "input");
          const outputRoot = pathHost.join(stageRoot, "src");
          const inputProject = pathHost.join(inputDir, "tsconfig.json");
          const reportFile = pathHost.join(stageRoot, "bake-report.json");
          await fs.rm(stageRoot, { recursive: true, force: true });
          await fs.mkdir(inputDir, { recursive: true });

          const projectPath = pathHost.resolve(configRoot, config.project ?? "tsconfig.json");
          const inputFiles = [...new Set([...config.entries, ...(config.intrinsicModules ?? [])]
            .map(value => pathHost.resolve(configRoot, value)))];
          await writeJson(inputProject, {
            extends: relativeJson(inputDir, projectPath),
            compilerOptions: {
              noEmit: true,
              incremental: false,
              composite: false,
              declaration: false,
              declarationMap: false,
              sourceMap: false,
            },
            files: inputFiles.map(value => relativeJson(inputDir, value)),
            include: [],
            exclude: [],
          });

          const moduleDir = pathHost.dirname(urlHost.fileURLToPath(import.meta.url));
          const bakeRoot = pathHost.resolve(moduleDir, "../vendor/bake");
          const bakeProject = pathHost.join(bakeRoot, "tsconfig.json");
          const bakeCli = pathHost.join(bakeRoot, "dist/cli.js");
          if (!await exists(bakeProject)) {
            throw new Error("Baguette's Bake submodule is missing; run git submodule update --init --recursive");
          }
          if (!await exists(bakeCli)) {
            const resolver = (import.meta as unknown as { resolve(specifier: string): string }).resolve;
            const typescriptFile = urlHost.fileURLToPath(resolver("typescript"));
            const tscFile = pathHost.join(pathHost.dirname(typescriptFile), "tsc.js");
            await run([processHost.execPath, tscFile, "-p", bakeProject], bakeRoot, "Bake build");
          }

          await run([
            processHost.execPath,
            bakeCli,
            "--engine", processHost.env.BAGUETTE_BAKE_ENGINE ?? "auto",
            "--project", inputProject,
            "--out-dir", outputRoot,
            "--report", reportFile,
            "--fail-on-warnings",
          ], root, "Bake");

          const program = parseProject(inputProject);
          const sources = program.getSourceFiles().filter(source =>
            !source.isDeclarationFile && !source.fileName.includes(`${pathHost.sep}node_modules${pathHost.sep}`)
          );
          const commonRoot = commonDirectory(sources.map(source => pathHost.dirname(source.fileName)));
          const sourceSet = new Set(sources.map(source => normalise(source.fileName)));

          function bakedSource(value: string): string {
            const absolute = normalise(pathHost.resolve(configRoot, value));
            if (!sourceSet.has(absolute)) throw new Error(`Bake did not load configured source ${value}`);
            const relative = pathHost.relative(commonRoot, absolute);
            if (relative.startsWith("..") || pathHost.isAbsolute(relative)) {
              throw new Error(`Bake source ${value} is outside the emitted programme root`);
            }
            return pathHost.resolve(outputRoot, relative);
          }

          const finalProject = pathHost.join(outputRoot, "tsconfig.json");
          await writeJson(finalProject, {
            extends: relativeJson(outputRoot, projectPath),
            compilerOptions: {
              noEmit: true,
              rootDir: ".",
              incremental: false,
              composite: false,
              declaration: false,
              declarationMap: false,
              sourceMap: false,
            },
            files: sources.map(source => relativeJson(
              outputRoot,
              pathHost.resolve(outputRoot, pathHost.relative(commonRoot, source.fileName)),
            )),
            include: [],
            exclude: [],
          });

          const bakedConfig: Record<string, unknown> = {
            ...config,
            project: finalProject,
            entries: config.entries.map(bakedSource),
            intrinsicModules: (config.intrinsicModules ?? []).map(bakedSource),
          };
          if (config.generatedDir !== undefined) bakedConfig.generatedDir = pathHost.resolve(configRoot, config.generatedDir);
          if (config.outDir !== undefined) bakedConfig.outDir = pathHost.resolve(configRoot, config.outDir);
          if (config.preludeFile !== undefined) bakedConfig.preludeFile = pathHost.resolve(configRoot, config.preludeFile);
          if (config.variants !== undefined) {
            bakedConfig.variants = config.variants.map(variant => variant.preludeFile === undefined ? variant : {
              ...variant,
              preludeFile: pathHost.resolve(configRoot, variant.preludeFile),
            });
          }

          const bakedConfigPath = pathHost.join(stageRoot, "baguette.config.json");
          await writeJson(bakedConfigPath, bakedConfig);
          setConfigArg(bakedConfigPath);
          console.log(`Baguette: Bake prepared ${sources.length} source module(s)`);
          TS

          python3 <<'PY'
          import json
          from pathlib import Path

          compiler = Path('src/compiler.ts')
          text = compiler.read_text()
          line = 'import "./bake-stage.ts";\n'
          if not text.startswith(line):
              compiler.write_text(line + text)

          package = Path('package.json')
          data = json.loads(package.read_text())
          data['scripts']['check'] = 'tsc -p tsconfig.json --noEmit && npm run bake:check'
          data['scripts']['bake:check'] = 'tsc -p vendor/bake/tsconfig.json --noEmit && tsc -p vendor/bake/tsconfig.core.json --noEmit'
          data['devDependencies'] = {'@types/node': '^22.15.0', **data.get('devDependencies', {})}
          package.write_text(json.dumps(data, indent=2) + '\n')

          tsconfig = Path('tsconfig.json')
          data = json.loads(tsconfig.read_text())
          data['compilerOptions']['allowImportingTsExtensions'] = True
          tsconfig.write_text(json.dumps(data, indent=2) + '\n')
          PY

          cat > README.md <<'EOF'
          # Baguette

          **BAGUETTE** means **Baguette Ahead-of-time Generates Universal Executables, Targeting Teto Efficiently**.

          Baguette is an ahead-of-time compiler from TypeScript to WebAssembly. Bake is its canonical source frontend: every compilation first validates the configured programme and safely lowers compatible TypeScript into Baguette's deterministic subset. Baguette then remains the final authority for subset validation, lowering and WebAssembly generation.

          ```text
          TypeScript
              -> Bake validation and safe source lowering
              -> Baguette-compatible TypeScript
              -> Baguette AOT compilation
              -> WebAssembly
          ```

          ## Requirements

          - Bun 1.1 or later, or Node.js 22.6 or later with TypeScript stripping enabled;
          - TypeScript;
          - AssemblyScript and Binaryen, as pinned by `package.json`;
          - a recursive Git checkout so the pinned Bake and KITTYX submodules are present.

          ## Use

              git submodule update --init --recursive
              npm install
              bun src/compiler.ts --config baguette.config.json

          Validate without writing the final WebAssembly modules:

              bun src/compiler.ts --config baguette.config.json --validate-only

          Skip the second deterministic-build pass during local development:

              bun src/compiler.ts --config baguette.config.json --skip-determinism-check

          `BAGUETTE_BAKE_ENGINE` may select Bake's `auto`, `host` or `wasm` core. `auto` is the default. Baguette builds the pinned Bake CLI locally when its generated JavaScript is absent.

          Copy `baguette.config.example.json` as a starting point for a target configuration.

          ## Documentation

          - [Compiler pipeline](docs/compiler.md)
          - [Configuration](docs/configuration.md)
          - [Supported TypeScript](docs/language-subset.md)

          ## Licence

          MIT. See `LICENSE`.
          EOF

          cat > docs/compiler.md <<'EOF'
          # Compiler pipeline

          Baguette builds a TypeScript programme in six stages.

          1. The configured TypeScript project, entry modules and intrinsic modules are isolated into the compilation boundary.
          2. The pinned Bake frontend validates that boundary and safely lowers supported wider TypeScript constructs into Baguette's deterministic subset.
          3. Baguette loads Bake's emitted source tree and remains the final validator for the supported language subset and configured ABI types.
          4. Types, control flow and asynchronous functions are lowered to Baguette's WebAssembly model.
          5. The selected prelude and memory settings are applied to each configured variant.
          6. WebAssembly, declarations and the build manifest are written to the configured output directories.

          Bake is a compile-time source dependency only. It does not add a runtime, interpreter or virtual machine to generated programmes. The original output paths in `baguette.config.json` remain authoritative; Bake's intermediate source and report are written below `build/baguette-bake/`.

          Unless `--skip-determinism-check` is supplied, Baguette repeats the generation pass and compares the result. Different bytes from the same input are treated as a build failure.
          EOF

          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with:
                    submodules: recursive

                - uses: oven-sh/setup-bun@v2

                - uses: actions/setup-node@v4
                  with:
                    node-version: 22

                - name: Install
                  run: npm install --package-lock=false

                - name: Check Baguette and Bake
                  run: npm run check

                - name: Verify Teto compatibility
                  run: |
                    git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/kitty-crow/teto.git ../teto-check
                    rm -rf ../teto-check/baguette
                    mkdir -p ../teto-check/baguette
                    rsync -a --exclude .git --exclude node_modules ./ ../teto-check/baguette/
                    cd ../teto-check
                    npm install
                    npm run teto:build

                - name: Verify Sandsara compatibility
                  run: |
                    git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/kitty-crow/sandsara-track-viewer.git ../sandsara-check
                    rm -rf ../sandsara-check/baguette
                    mkdir -p ../sandsara-check/baguette
                    rsync -a --exclude .git --exclude node_modules ./ ../sandsara-check/baguette/
                    cd ../sandsara-check
                    npm install
                    npm run build:router-wasm
          EOF

          rm .github/workflows/agent-canonical-bake.yml

      - name: Install
        run: npm install --package-lock=false

      - name: Check Baguette and Bake
        run: npm run check

      - name: Verify Teto compatibility
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/kitty-crow/teto.git ../teto-check
          rm -rf ../teto-check/baguette
          mkdir -p ../teto-check/baguette
          rsync -a --exclude .git --exclude node_modules ./ ../teto-check/baguette/
          cd ../teto-check
          npm install
          npm run teto:build

      - name: Verify Sandsara compatibility
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/kitty-crow/sandsara-track-viewer.git ../sandsara-check
          rm -rf ../sandsara-check/baguette
          mkdir -p ../sandsara-check/baguette
          rsync -a --exclude .git --exclude node_modules ./ ../sandsara-check/baguette/
          cd ../sandsara-check
          npm install
          npm run build:router-wasm

      - name: Commit validated integration
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "Kitty Crow"
          git config user.email "141717449+kitty-crow@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Bake into Baguette compilation"
          git push origin HEAD:agent/canonical-bake

      - name: Remove merged work branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 180); do
            merged_at="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.merged_at // empty')"
            if [ -n "$merged_at" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_HEAD_REF" || true
              exit 0
            fi
            sleep 10
          done
          echo "Pull request was not merged before the cleanup window closed" >&2
          exit 1
