name: Apply engine wide patch

on:
  pull_request:
    branches: [agent/obfuscation-lowering]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/tarot-engine-wide'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tarot-engine-wide
          fetch-depth: 0
          submodules: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply and verify
        run: |
          set -Eeuo pipefail
          cat .apply-wide2.00 .apply-wide2.01 .apply-wide2.02 .apply-wide2.03 | base64 -d | gzip -d > /tmp/wide.patch
          git apply --index /tmp/wide.patch
          git update-index --add --cacheinfo 160000,a4884a8235e87ca0b44fe1c95581da6531283eee,vendor/bake
          rm .apply-wide.00 .apply-wide.01 .apply-wide.02 .apply-wide.03
          rm .apply-wide2.00 .apply-wide2.01 .apply-wide2.02 .apply-wide2.03
          rm .github/workflows/apply-wide.yml
          rm -f .github/workflows/source-snapshot.yml
          git add -A
          git submodule sync --recursive
          git submodule update --init --recursive
          npm install --package-lock=false
          npm run check

      - name: Commit branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Compile application cores through wide lowering"
          git push origin HEAD:agent/tarot-engine-wide
