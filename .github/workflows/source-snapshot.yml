name: Compiler snapshot

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - name: Install compiler dependencies
        run: npm install --package-lock=false

      - name: Pack compiler runtime
        run: |
          mkdir snapshot
          rsync -aL --exclude .git --exclude build --exclude dist ./ snapshot/
          printf '%s\n' "$(git rev-parse HEAD)" > snapshot/COMMIT

      - uses: actions/upload-artifact@v4
        with:
          name: baguette-wide-runtime
          path: snapshot
          if-no-files-found: error
          retention-days: 1
